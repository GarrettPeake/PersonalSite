<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Photography by Garrett Peake">
  <title>Photography | Garrett Peake</title>

  <!-- Styles -->
  <link rel="stylesheet" href="/styles/theme.css">
  <link rel="stylesheet" href="/styles/base.css">
  <link rel="stylesheet" href="/styles/pages/photography.css">

  <!-- Prevent FOUC -->
  <script>
    (function() {
      const theme = localStorage.getItem('theme') ||
        (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body class="page">
  <gp-tracker></gp-tracker>
  <gp-site-header></gp-site-header>

  <main class="photo-main">
    <div class="photo-content">
      <h1 class="page-title">Photography</h1>

      <div class="photo-grid" id="photo-grid">
        <p class="loading">Loading photos...</p>
      </div>
    </div>
  </main>

  <gp-site-footer></gp-site-footer>

  <!-- Photo Modal -->
  <gp-photo-modal></gp-photo-modal>

  <!-- Web Components -->
  <script type="module" src="/components/core/gp-site-header.js"></script>
  <script type="module" src="/components/core/gp-site-footer.js"></script>
  <script type="module" src="/components/core/gp-photo-modal.js"></script>
  <script type="module" src="/components/tracking/gp-tracker.js"></script>

  <script src="/js/photography.js"></script>
</body>
</html>
