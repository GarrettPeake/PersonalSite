<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Edit About | Admin</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="stylesheet" href="/styles/theme.css">
  <link rel="stylesheet" href="/styles/base.css">
  <link rel="stylesheet" href="/styles/components.css">
  <link rel="stylesheet" href="/styles/admin.css">
  <link rel="stylesheet" href="/styles/markdown-content.css">
  <link rel="stylesheet" href="/styles/pages/admin-editor.css">
  <script type="module" src="/components/core/gp-theme-toggle.js"></script>
  <script src="/lib/markdown.js"></script>
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="/" class="logo">GP</a>
        <span class="admin-badge">Admin</span>
      </div>

      <nav class="sidebar-nav">
        <a href="/admin/" class="nav-item">Dashboard</a>
        <a href="/admin/posts" class="nav-item">Posts</a>
        <a href="/admin/drafts" class="nav-item">Drafts</a>
        <a href="/admin/photos" class="nav-item">Photos</a>
        <a href="/admin/projects" class="nav-item">Projects</a>
        <a href="/admin/about" class="nav-item active">About</a>
        <a href="/admin/tracking" class="nav-item">Tracking</a>
      </nav>

      <div class="sidebar-footer">
        <gp-theme-toggle></gp-theme-toggle>
        <button id="logout-btn" class="btn-logout">Logout</button>
      </div>
    </aside>

    <main class="admin-main editor-main">
      <header class="editor-header">
        <div class="editor-meta">
          <h1 style="margin: 0; font-size: 1.25rem;">Edit About Page</h1>
        </div>
        <div class="editor-actions">
          <span id="save-status" class="save-status"></span>
          <button id="save-btn" class="btn-primary">Save</button>
        </div>
      </header>

      <div class="toolbar">
        <button type="button" data-action="bold" title="Bold (Ctrl+B)"><strong>B</strong></button>
        <button type="button" data-action="italic" title="Italic (Ctrl+I)"><em>I</em></button>
        <button type="button" data-action="code" title="Inline Code">`</button>
        <span class="toolbar-divider"></span>
        <button type="button" data-action="h2" title="Heading 2">H2</button>
        <button type="button" data-action="h3" title="Heading 3">H3</button>
        <span class="toolbar-divider"></span>
        <button type="button" data-action="link" title="Link">Link</button>
        <button type="button" data-action="image" title="Image">Img</button>
        <span class="toolbar-divider"></span>
        <button type="button" data-action="ul" title="Bullet List">List</button>
        <button type="button" data-action="quote" title="Blockquote">Quote</button>
        <button type="button" data-action="codeblock" title="Code Block">Code</button>
        <span class="toolbar-divider"></span>
        <button type="button" data-action="banner" title="Banner Macro">Banner</button>
        <button type="button" data-action="callout" title="Callout Box">Callout</button>
        <button type="button" data-action="twocolumn" title="Two Column Layout">2-Col</button>
        <button type="button" data-action="linkpreview" title="Link Preview Card">Link</button>
        <button type="button" data-action="iframe" title="Embed Iframe">Embed</button>
      </div>

      <div class="editor-split">
        <div class="editor-pane">
          <textarea id="content" placeholder="Write your about page content in markdown..."></textarea>
        </div>
        <div class="preview-pane">
          <div id="preview" class="preview-content md-content"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/admin/about.js"></script>
</body>
</html>
