<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Admin Dashboard | Garrett Peake</title>
  <link rel="stylesheet" href="/styles/theme.css">
  <link rel="stylesheet" href="/styles/base.css">
  <link rel="stylesheet" href="/styles/components.css">
  <link rel="stylesheet" href="/styles/admin.css">
  <link rel="stylesheet" href="/styles/pages/admin-dashboard.css">
  <script type="module" src="/components/core/gp-theme-toggle.js"></script>
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="/" class="logo">GP</a>
        <span class="admin-badge">Admin</span>
      </div>

      <nav class="sidebar-nav">
        <a href="/admin/" class="nav-item active">Dashboard</a>
        <a href="/admin/posts" class="nav-item">Posts</a>
        <a href="/admin/drafts" class="nav-item">Drafts</a>
        <a href="/admin/photos" class="nav-item">Photos</a>
        <a href="/admin/projects" class="nav-item">Projects</a>
        <a href="/admin/tracking" class="nav-item">Tracking</a>
      </nav>

      <div class="sidebar-footer">
        <gp-theme-toggle></gp-theme-toggle>
        <button id="logout-btn" class="btn-logout">Logout</button>
      </div>
    </aside>

    <main class="admin-main">
      <header class="admin-header">
        <h1>Dashboard</h1>
        <a href="/admin/editor" class="btn-primary">+ New Post</a>
      </header>

      <div class="stats-grid" id="stats">
        <div class="stat-card">
          <div class="stat-value" id="post-count">-</div>
          <div class="stat-label">Published Posts</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="draft-count">-</div>
          <div class="stat-label">Drafts</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="tracking-count">-</div>
          <div class="stat-label">Tracking Links</div>
        </div>
      </div>

      <section class="recent-section">
        <h2>Recent Drafts</h2>
        <div id="recent-drafts" class="item-list">
          <p class="empty">Loading...</p>
        </div>
      </section>

      <section class="recent-section">
        <h2>Recent Posts</h2>
        <div id="recent-posts" class="item-list">
          <p class="empty">Loading...</p>
        </div>
      </section>
    </main>
  </div>

  <script src="/js/admin/dashboard.js"></script>
</body>
</html>
