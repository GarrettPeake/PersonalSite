<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Editor | Admin | Garrett Peake</title>
  <link rel="stylesheet" href="/styles/theme.css">
  <link rel="stylesheet" href="/styles/base.css">
  <script type="module" src="/components/core/gp-theme-toggle.js"></script>
  <script src="/lib/markdown.js"></script>
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="/" class="logo">GP</a>
        <span class="admin-badge">Admin</span>
      </div>

      <nav class="sidebar-nav">
        <a href="/admin/" class="nav-item">Dashboard</a>
        <a href="/admin/posts" class="nav-item">Posts</a>
        <a href="/admin/drafts" class="nav-item">Drafts</a>
        <a href="/admin/tracking" class="nav-item">Tracking</a>
      </nav>

      <div class="sidebar-footer">
        <gp-theme-toggle></gp-theme-toggle>
        <button id="logout-btn" class="btn-logout">Logout</button>
      </div>
    </aside>

    <main class="admin-main editor-main">
      <header class="editor-header">
        <div class="editor-meta">
          <input type="text" id="title" placeholder="Post Title" class="title-input">
          <div class="slug-row">
            <span class="slug-prefix">/blog/</span>
            <input type="text" id="slug" placeholder="post-slug" class="slug-input">
          </div>
        </div>
        <div class="editor-actions">
          <span id="save-status" class="save-status"></span>
          <button id="preview-btn" class="btn-secondary">Preview</button>
          <button id="save-btn" class="btn-secondary">Save Draft</button>
          <button id="publish-btn" class="btn-primary">Publish</button>
        </div>
      </header>

      <div class="toolbar">
        <button type="button" data-action="bold" title="Bold (Ctrl+B)"><strong>B</strong></button>
        <button type="button" data-action="italic" title="Italic (Ctrl+I)"><em>I</em></button>
        <button type="button" data-action="code" title="Inline Code">`</button>
        <span class="toolbar-divider"></span>
        <button type="button" data-action="h2" title="Heading 2">H2</button>
        <button type="button" data-action="h3" title="Heading 3">H3</button>
        <span class="toolbar-divider"></span>
        <button type="button" data-action="link" title="Link">Link</button>
        <button type="button" data-action="image" title="Image">Img</button>
        <span class="toolbar-divider"></span>
        <button type="button" data-action="ul" title="Bullet List">List</button>
        <button type="button" data-action="quote" title="Blockquote">Quote</button>
        <button type="button" data-action="codeblock" title="Code Block">Code</button>
        <span class="toolbar-divider"></span>
        <button type="button" data-action="banner" title="Banner Macro">Banner</button>
      </div>

      <div class="editor-split">
        <div class="editor-pane">
          <textarea id="content" placeholder="Write your post in markdown..."></textarea>
        </div>
        <div class="preview-pane">
          <div id="preview" class="preview-content"></div>
        </div>
      </div>
    </main>
  </div>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
    }

    .admin-layout {
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar (same as dashboard) */
    .sidebar {
      width: 240px;
      background: var(--color-bg);
      border-right: 3px solid var(--color-border);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      z-index: 100;
    }

    .sidebar-header {
      padding: var(--space-lg);
      border-bottom: 2px dashed var(--color-border);
      display: flex;
      align-items: center;
      gap: var(--space-sm);
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--color-primary);
      text-decoration: none;
    }

    .admin-badge {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: var(--space-xs) var(--space-sm);
      border: 2px solid var(--color-text);
      background: var(--color-accent);
      color: var(--color-bg);
    }

    .sidebar-nav {
      flex: 1;
      padding: var(--space-md);
    }

    .nav-item {
      display: block;
      padding: var(--space-sm) var(--space-md);
      color: var(--color-text);
      text-decoration: none;
      font-weight: 500;
      border: 2px solid transparent;
      margin-bottom: var(--space-xs);
      transition: all 0.1s;
    }

    .nav-item:hover {
      border-color: var(--color-border);
      background: color-mix(in srgb, var(--color-primary) 10%, transparent);
    }

    .nav-item.active {
      border-color: var(--color-primary);
      background: color-mix(in srgb, var(--color-primary) 10%, transparent);
    }

    .sidebar-footer {
      padding: var(--space-md);
      border-top: 2px dashed var(--color-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .btn-logout {
      padding: var(--space-xs) var(--space-sm);
      border: 2px solid var(--color-text);
      background: transparent;
      color: var(--color-text);
      font-weight: 600;
      font-size: 0.875rem;
      cursor: pointer;
      transition: all 0.1s;
    }

    .btn-logout:hover {
      background: var(--color-text);
      color: var(--color-bg);
    }

    /* Main Editor Area */
    .editor-main {
      flex: 1;
      margin-left: 240px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    /* Editor Header */
    .editor-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: var(--space-md);
      border-bottom: 3px solid var(--color-border);
      background: var(--color-bg);
      gap: var(--space-md);
    }

    .editor-meta {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
    }

    .title-input {
      font-size: 1.5rem;
      font-weight: 700;
      border: none;
      border-bottom: 2px solid var(--color-border);
      background: transparent;
      color: var(--color-text);
      padding: var(--space-sm) 0;
      width: 100%;
    }

    .title-input:focus {
      outline: none;
      border-bottom-color: var(--color-primary);
    }

    .slug-row {
      display: flex;
      align-items: center;
      gap: 0;
    }

    .slug-prefix {
      color: color-mix(in srgb, var(--color-text) 50%, transparent);
      font-family: var(--font-mono);
      font-size: 0.875rem;
    }

    .slug-input {
      font-family: var(--font-mono);
      font-size: 0.875rem;
      border: none;
      background: transparent;
      color: var(--color-text);
      padding: var(--space-xs) 0;
      flex: 1;
    }

    .slug-input:focus {
      outline: none;
    }

    .editor-actions {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      flex-shrink: 0;
    }

    .save-status {
      font-size: 0.75rem;
      color: color-mix(in srgb, var(--color-text) 60%, transparent);
    }

    .btn-primary {
      padding: var(--space-sm) var(--space-lg);
      border: 3px solid var(--color-text);
      background: var(--color-primary);
      color: var(--color-bg);
      font-weight: 700;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .btn-primary:hover {
      transform: translate(-2px, -2px);
      box-shadow: 4px 4px 0 var(--color-text);
    }

    .btn-secondary {
      padding: var(--space-sm) var(--space-md);
      border: 2px solid var(--color-border);
      background: transparent;
      color: var(--color-text);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.1s;
    }

    .btn-secondary:hover {
      background: color-mix(in srgb, var(--color-primary) 10%, transparent);
    }

    /* Toolbar */
    .toolbar {
      display: flex;
      align-items: center;
      gap: var(--space-xs);
      padding: var(--space-sm) var(--space-md);
      border-bottom: 2px dashed var(--color-border);
      background: color-mix(in srgb, var(--color-primary) 5%, var(--color-bg));
    }

    .toolbar button {
      padding: var(--space-xs) var(--space-sm);
      border: 2px solid transparent;
      background: transparent;
      color: var(--color-text);
      font-size: 0.875rem;
      cursor: pointer;
      min-width: 32px;
      transition: all 0.1s;
    }

    .toolbar button:hover {
      border-color: var(--color-border);
      background: var(--color-bg);
    }

    .toolbar-divider {
      width: 1px;
      height: 24px;
      background: var(--color-border);
      margin: 0 var(--space-xs);
    }

    /* Split Pane */
    .editor-split {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .editor-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-right: 2px solid var(--color-border);
    }

    .editor-pane textarea {
      flex: 1;
      border: none;
      padding: var(--space-md);
      font-family: var(--font-mono);
      font-size: 0.9rem;
      line-height: 1.6;
      resize: none;
      background: var(--color-bg);
      color: var(--color-text);
    }

    .editor-pane textarea:focus {
      outline: none;
    }

    .preview-pane {
      flex: 1;
      overflow-y: auto;
      background: var(--color-bg);
    }

    .preview-content {
      padding: var(--space-md);
      max-width: var(--max-width-prose);
      margin: 0 auto;
      line-height: 1.8;
    }

    .preview-content h1, .preview-content h2, .preview-content h3 {
      margin-top: var(--space-lg);
    }

    .preview-content pre {
      overflow-x: auto;
    }

    .preview-content img {
      max-width: 100%;
      height: auto;
    }

    .preview-content blockquote {
      border-left: 4px solid var(--color-primary);
      padding-left: var(--space-md);
      margin: var(--space-md) 0;
      font-style: italic;
    }

    .preview-content .macro-unknown {
      color: #ff4444;
      background: color-mix(in srgb, #ff4444 10%, transparent);
      padding: var(--space-xs) var(--space-sm);
    }

    /* Responsive */
    @media (max-width: 1024px) {
      .editor-split {
        flex-direction: column;
      }

      .editor-pane {
        border-right: none;
        border-bottom: 2px solid var(--color-border);
        flex: 1;
      }

      .preview-pane {
        flex: 1;
      }
    }

    @media (max-width: 768px) {
      .sidebar {
        display: none;
      }

      .editor-main {
        margin-left: 0;
      }

      .editor-header {
        flex-direction: column;
      }

      .editor-actions {
        width: 100%;
        justify-content: flex-end;
      }
    }
  </style>

  <script>
    // State
    let currentId = null;
    let isDraft = true;
    let isLoading = false;
    let hasUnsavedChanges = false;
    let autoSaveTimer = null;

    // Elements
    const titleInput = document.getElementById('title');
    const slugInput = document.getElementById('slug');
    const contentInput = document.getElementById('content');
    const previewEl = document.getElementById('preview');
    const saveStatus = document.getElementById('save-status');
    const saveBtn = document.getElementById('save-btn');
    const publishBtn = document.getElementById('publish-btn');
    const previewBtn = document.getElementById('preview-btn');

    // Initialize
    async function init() {
      // Check for edit mode from URL
      const params = new URLSearchParams(window.location.search);
      const draftId = params.get('draft');
      const postId = params.get('post');

      if (draftId) {
        await loadDraft(draftId);
      } else if (postId) {
        await loadPost(postId);
      }

      // Set up event listeners
      titleInput.addEventListener('input', handleTitleChange);
      slugInput.addEventListener('input', handleChange);
      contentInput.addEventListener('input', handleContentChange);

      // Toolbar buttons
      document.querySelectorAll('.toolbar button').forEach(btn => {
        btn.addEventListener('click', () => handleToolbarAction(btn.dataset.action));
      });

      // Action buttons
      saveBtn.addEventListener('click', handleSave);
      publishBtn.addEventListener('click', handlePublish);
      previewBtn.addEventListener('click', handlePreview);

      // Keyboard shortcuts
      document.addEventListener('keydown', handleKeyboard);

      // Warn on unsaved changes
      window.addEventListener('beforeunload', (e) => {
        if (hasUnsavedChanges) {
          e.preventDefault();
          e.returnValue = '';
        }
      });

      // Initial preview
      updatePreview();
    }

    // Load draft for editing
    async function loadDraft(id) {
      try {
        const res = await fetch(`/api/admin/drafts/${id}`);
        if (!res.ok) {
          if (res.status === 401) {
            window.location.href = '/admin/login';
            return;
          }
          throw new Error('Failed to load draft');
        }
        const draft = await res.json();
        currentId = draft.id;
        isDraft = true;
        titleInput.value = draft.title || '';
        slugInput.value = draft.slug || '';
        contentInput.value = draft.content || '';
        updatePreview();
        publishBtn.textContent = 'Publish';
        saveBtn.style.display = '';
      } catch (err) {
        console.error('Failed to load draft:', err);
        saveStatus.textContent = 'Failed to load';
      }
    }

    // Load post for editing
    async function loadPost(id) {
      try {
        const res = await fetch(`/api/admin/posts/${id}`);
        if (!res.ok) {
          if (res.status === 401) {
            window.location.href = '/admin/login';
            return;
          }
          throw new Error('Failed to load post');
        }
        const post = await res.json();
        currentId = post.id;
        isDraft = false;
        titleInput.value = post.title || '';
        slugInput.value = post.slug || '';
        contentInput.value = post.content || '';
        updatePreview();
        publishBtn.textContent = 'Update';
        saveBtn.style.display = 'none';
      } catch (err) {
        console.error('Failed to load post:', err);
        saveStatus.textContent = 'Failed to load';
      }
    }

    // Handle title change - auto-generate slug
    function handleTitleChange() {
      handleChange();
      if (!currentId && !slugInput.value) {
        slugInput.value = slugify(titleInput.value);
      }
    }

    // Handle any input change
    function handleChange() {
      hasUnsavedChanges = true;
      saveStatus.textContent = 'Unsaved changes';

      // Auto-save after 2 seconds of inactivity
      if (autoSaveTimer) clearTimeout(autoSaveTimer);
      if (isDraft && currentId) {
        autoSaveTimer = setTimeout(() => autoSave(), 2000);
      }
    }

    // Handle content change
    function handleContentChange() {
      handleChange();
      updatePreview();
    }

    // Update preview pane
    function updatePreview() {
      const content = contentInput.value;
      previewEl.innerHTML = window.renderMarkdown(content) || '<p style="color: var(--color-text); opacity: 0.5;">Preview will appear here...</p>';
    }

    // Auto-save draft
    async function autoSave() {
      if (!isDraft || !currentId || isLoading) return;

      isLoading = true;
      saveStatus.textContent = 'Saving...';

      try {
        const res = await fetch(`/api/admin/drafts/${currentId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            title: titleInput.value,
            slug: slugInput.value,
            content: contentInput.value,
          }),
        });

        if (res.ok) {
          hasUnsavedChanges = false;
          saveStatus.textContent = 'Saved';
        } else {
          saveStatus.textContent = 'Save failed';
        }
      } catch (err) {
        saveStatus.textContent = 'Save failed';
      } finally {
        isLoading = false;
      }
    }

    // Handle save button
    async function handleSave() {
      if (isLoading) return;

      isLoading = true;
      saveStatus.textContent = 'Saving...';

      try {
        const data = {
          title: titleInput.value,
          slug: slugInput.value,
          content: contentInput.value,
        };

        let res;
        if (currentId && isDraft) {
          res = await fetch(`/api/admin/drafts/${currentId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data),
          });
        } else {
          res = await fetch('/api/admin/drafts', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data),
          });
        }

        if (res.ok) {
          const result = await res.json();
          currentId = result.id;
          isDraft = true;
          hasUnsavedChanges = false;
          saveStatus.textContent = 'Saved';

          // Update URL without reload
          const url = new URL(window.location);
          url.searchParams.set('draft', currentId);
          url.searchParams.delete('post');
          window.history.replaceState({}, '', url);
        } else {
          const err = await res.json();
          saveStatus.textContent = err.error || 'Save failed';
        }
      } catch (err) {
        saveStatus.textContent = 'Save failed';
      } finally {
        isLoading = false;
      }
    }

    // Handle publish button
    async function handlePublish() {
      if (isLoading) return;

      if (!titleInput.value.trim()) {
        saveStatus.textContent = 'Title required';
        return;
      }

      if (!slugInput.value.trim()) {
        saveStatus.textContent = 'Slug required';
        return;
      }

      isLoading = true;
      saveStatus.textContent = isDraft ? 'Publishing...' : 'Updating...';

      try {
        if (isDraft) {
          // First save the draft if needed
          if (!currentId) {
            const createRes = await fetch('/api/admin/drafts', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                title: titleInput.value,
                slug: slugInput.value,
                content: contentInput.value,
              }),
            });
            if (!createRes.ok) throw new Error('Failed to create draft');
            const draft = await createRes.json();
            currentId = draft.id;
          } else {
            // Update draft first
            await fetch(`/api/admin/drafts/${currentId}`, {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                title: titleInput.value,
                slug: slugInput.value,
                content: contentInput.value,
              }),
            });
          }

          // Then publish
          const res = await fetch(`/api/admin/drafts/${currentId}/publish`, {
            method: 'POST',
          });

          if (res.ok) {
            const post = await res.json();
            hasUnsavedChanges = false;
            saveStatus.textContent = 'Published!';

            // Redirect to posts page
            setTimeout(() => {
              window.location.href = '/admin/posts';
            }, 1000);
          } else {
            const err = await res.json();
            saveStatus.textContent = err.error || 'Publish failed';
          }
        } else {
          // Update published post
          const res = await fetch(`/api/admin/posts/${currentId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              title: titleInput.value,
              slug: slugInput.value,
              content: contentInput.value,
            }),
          });

          if (res.ok) {
            hasUnsavedChanges = false;
            saveStatus.textContent = 'Updated!';
          } else {
            const err = await res.json();
            saveStatus.textContent = err.error || 'Update failed';
          }
        }
      } catch (err) {
        saveStatus.textContent = isDraft ? 'Publish failed' : 'Update failed';
      } finally {
        isLoading = false;
      }
    }

    // Handle preview button
    function handlePreview() {
      const slug = slugInput.value || 'preview';
      window.open(`/blog/${slug}`, '_blank');
    }

    // Handle toolbar actions
    function handleToolbarAction(action) {
      const textarea = contentInput;
      const start = textarea.selectionStart;
      const end = textarea.selectionEnd;
      const selected = textarea.value.substring(start, end);

      let insert = '';
      let cursorOffset = 0;

      switch (action) {
        case 'bold':
          insert = `**${selected || 'bold text'}**`;
          cursorOffset = selected ? insert.length : 2;
          break;
        case 'italic':
          insert = `*${selected || 'italic text'}*`;
          cursorOffset = selected ? insert.length : 1;
          break;
        case 'code':
          insert = `\`${selected || 'code'}\``;
          cursorOffset = selected ? insert.length : 1;
          break;
        case 'h2':
          insert = `\n## ${selected || 'Heading'}`;
          cursorOffset = insert.length;
          break;
        case 'h3':
          insert = `\n### ${selected || 'Heading'}`;
          cursorOffset = insert.length;
          break;
        case 'link':
          insert = `[${selected || 'link text'}](url)`;
          cursorOffset = selected ? insert.length - 1 : 1;
          break;
        case 'image':
          insert = `![${selected || 'alt text'}](image-url)`;
          cursorOffset = selected ? insert.length - 1 : 2;
          break;
        case 'ul':
          insert = `\n- ${selected || 'List item'}`;
          cursorOffset = insert.length;
          break;
        case 'quote':
          insert = `\n> ${selected || 'Quote'}`;
          cursorOffset = insert.length;
          break;
        case 'codeblock':
          insert = `\n\`\`\`\n${selected || 'code here'}\n\`\`\``;
          cursorOffset = selected ? insert.length : 5;
          break;
        case 'banner':
          insert = `\n/Banner(200px, "Title", "Subtitle", "")\n`;
          cursorOffset = 18;
          break;
      }

      textarea.value = textarea.value.substring(0, start) + insert + textarea.value.substring(end);
      textarea.focus();
      textarea.selectionStart = textarea.selectionEnd = start + cursorOffset;

      handleContentChange();
    }

    // Keyboard shortcuts
    function handleKeyboard(e) {
      if (e.ctrlKey || e.metaKey) {
        switch (e.key) {
          case 's':
            e.preventDefault();
            handleSave();
            break;
          case 'b':
            e.preventDefault();
            handleToolbarAction('bold');
            break;
          case 'i':
            e.preventDefault();
            handleToolbarAction('italic');
            break;
        }
      }
    }

    // Generate slug from title
    function slugify(text) {
      return text
        .toLowerCase()
        .trim()
        .replace(/[^\w\s-]/g, '')
        .replace(/[\s_-]+/g, '-')
        .replace(/^-+|-+$/g, '');
    }

    // Logout handler
    document.getElementById('logout-btn').addEventListener('click', async () => {
      await fetch('/api/auth/logout', { method: 'POST' });
      window.location.href = '/admin/login';
    });

    // Initialize on load
    init();
  </script>
</body>
</html>
