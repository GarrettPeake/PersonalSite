<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Posts | Admin | Garrett Peake</title>
  <link rel="stylesheet" href="/styles/theme.css">
  <link rel="stylesheet" href="/styles/base.css">
  <script type="module" src="/components/core/gp-theme-toggle.js"></script>
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="/" class="logo">GP</a>
        <span class="admin-badge">Admin</span>
      </div>

      <nav class="sidebar-nav">
        <a href="/admin/" class="nav-item">Dashboard</a>
        <a href="/admin/posts" class="nav-item active">Posts</a>
        <a href="/admin/drafts" class="nav-item">Drafts</a>
        <a href="/admin/tracking" class="nav-item">Tracking</a>
      </nav>

      <div class="sidebar-footer">
        <gp-theme-toggle></gp-theme-toggle>
        <button id="logout-btn" class="btn-logout">Logout</button>
      </div>
    </aside>

    <main class="admin-main">
      <header class="admin-header">
        <h1>Published Posts</h1>
        <a href="/admin/editor" class="btn-primary">+ New Post</a>
      </header>

      <div id="posts-list" class="data-table">
        <p class="loading">Loading posts...</p>
      </div>
    </main>
  </div>

  <!-- Confirm Dialog -->
  <div id="confirm-dialog" class="dialog-overlay" hidden>
    <div class="dialog">
      <h3 id="dialog-title">Confirm Action</h3>
      <p id="dialog-message">Are you sure?</p>
      <div class="dialog-actions">
        <button id="dialog-cancel" class="btn-secondary">Cancel</button>
        <button id="dialog-confirm" class="btn-danger">Confirm</button>
      </div>
    </div>
  </div>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
    }

    .admin-layout {
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 240px;
      background: var(--color-bg);
      border-right: 3px solid var(--color-border);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
    }

    .sidebar-header {
      padding: var(--space-lg);
      border-bottom: 2px dashed var(--color-border);
      display: flex;
      align-items: center;
      gap: var(--space-sm);
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--color-primary);
      text-decoration: none;
    }

    .admin-badge {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: var(--space-xs) var(--space-sm);
      border: 2px solid var(--color-text);
      background: var(--color-accent);
      color: var(--color-bg);
    }

    .sidebar-nav {
      flex: 1;
      padding: var(--space-md);
    }

    .nav-item {
      display: block;
      padding: var(--space-sm) var(--space-md);
      color: var(--color-text);
      text-decoration: none;
      font-weight: 500;
      border: 2px solid transparent;
      margin-bottom: var(--space-xs);
      transition: all 0.1s;
    }

    .nav-item:hover {
      border-color: var(--color-border);
      background: color-mix(in srgb, var(--color-primary) 10%, transparent);
    }

    .nav-item.active {
      border-color: var(--color-primary);
      background: color-mix(in srgb, var(--color-primary) 10%, transparent);
    }

    .sidebar-footer {
      padding: var(--space-md);
      border-top: 2px dashed var(--color-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .btn-logout {
      padding: var(--space-xs) var(--space-sm);
      border: 2px solid var(--color-text);
      background: transparent;
      color: var(--color-text);
      font-weight: 600;
      font-size: 0.875rem;
      cursor: pointer;
      transition: all 0.1s;
    }

    .btn-logout:hover {
      background: var(--color-text);
      color: var(--color-bg);
    }

    /* Main Content */
    .admin-main {
      flex: 1;
      margin-left: 240px;
      padding: var(--space-xl);
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-xl);
      padding-bottom: var(--space-lg);
      border-bottom: 3px solid var(--color-border);
    }

    .admin-header h1 {
      margin: 0;
    }

    .btn-primary {
      padding: var(--space-sm) var(--space-lg);
      border: 3px solid var(--color-text);
      background: var(--color-primary);
      color: var(--color-bg);
      font-weight: 700;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .btn-primary:hover {
      transform: translate(-2px, -2px);
      box-shadow: 4px 4px 0 var(--color-text);
    }

    /* Data Table */
    .data-table {
      border: 3px solid var(--color-border);
    }

    .table-header {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 150px;
      gap: var(--space-md);
      padding: var(--space-md);
      background: color-mix(in srgb, var(--color-primary) 10%, transparent);
      border-bottom: 2px solid var(--color-border);
      font-weight: 700;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
    }

    .table-row {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 150px;
      gap: var(--space-md);
      padding: var(--space-md);
      border-bottom: 1px dashed var(--color-border);
      align-items: center;
    }

    .table-row:last-child {
      border-bottom: none;
    }

    .table-row:hover {
      background: color-mix(in srgb, var(--color-primary) 5%, transparent);
    }

    .post-title {
      font-weight: 600;
    }

    .post-title a {
      color: var(--color-text);
      text-decoration: none;
    }

    .post-title a:hover {
      color: var(--color-primary);
    }

    .post-slug {
      font-family: var(--font-mono);
      font-size: 0.875rem;
      color: color-mix(in srgb, var(--color-text) 60%, transparent);
    }

    .post-date {
      font-size: 0.875rem;
      color: color-mix(in srgb, var(--color-text) 60%, transparent);
    }

    .post-actions {
      display: flex;
      gap: var(--space-xs);
    }

    .btn-action {
      padding: var(--space-xs) var(--space-sm);
      border: 2px solid var(--color-border);
      background: transparent;
      color: var(--color-text);
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.1s;
    }

    .btn-action:hover {
      background: color-mix(in srgb, var(--color-primary) 10%, transparent);
    }

    .btn-action.danger:hover {
      background: #ff4444;
      border-color: #ff4444;
      color: white;
    }

    .loading, .empty {
      padding: var(--space-xl);
      text-align: center;
      color: color-mix(in srgb, var(--color-text) 50%, transparent);
      font-style: italic;
    }

    /* Dialog */
    .dialog-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }

    .dialog {
      background: var(--color-bg);
      border: 3px solid var(--color-border);
      padding: var(--space-xl);
      max-width: 400px;
      width: 90%;
    }

    .dialog h3 {
      margin: 0 0 var(--space-md);
    }

    .dialog p {
      margin: 0 0 var(--space-lg);
    }

    .dialog-actions {
      display: flex;
      gap: var(--space-sm);
      justify-content: flex-end;
    }

    .btn-secondary {
      padding: var(--space-sm) var(--space-md);
      border: 2px solid var(--color-border);
      background: transparent;
      color: var(--color-text);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.1s;
    }

    .btn-secondary:hover {
      background: color-mix(in srgb, var(--color-primary) 10%, transparent);
    }

    .btn-danger {
      padding: var(--space-sm) var(--space-md);
      border: 2px solid #ff4444;
      background: #ff4444;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.1s;
    }

    .btn-danger:hover {
      background: #cc3333;
      border-color: #cc3333;
    }

    /* Responsive */
    @media (max-width: 1024px) {
      .table-header, .table-row {
        grid-template-columns: 1fr 1fr 120px;
      }

      .table-header > *:nth-child(2),
      .table-row > *:nth-child(2) {
        display: none;
      }
    }

    @media (max-width: 768px) {
      .sidebar {
        width: 100%;
        position: relative;
        border-right: none;
        border-bottom: 3px solid var(--color-border);
      }

      .admin-main {
        margin-left: 0;
      }

      .admin-layout {
        flex-direction: column;
      }

      .table-header, .table-row {
        grid-template-columns: 1fr 100px;
      }

      .table-header > *:nth-child(3),
      .table-row > *:nth-child(3) {
        display: none;
      }
    }
  </style>

  <script>
    // Elements
    const postsList = document.getElementById('posts-list');
    const confirmDialog = document.getElementById('confirm-dialog');
    const dialogTitle = document.getElementById('dialog-title');
    const dialogMessage = document.getElementById('dialog-message');
    const dialogCancel = document.getElementById('dialog-cancel');
    const dialogConfirm = document.getElementById('dialog-confirm');

    // State
    let pendingAction = null;

    // Load posts on page load
    async function loadPosts() {
      try {
        const res = await fetch('/api/admin/posts');

        if (!res.ok) {
          if (res.status === 401) {
            window.location.href = '/admin/login';
            return;
          }
          throw new Error('Failed to load posts');
        }

        const posts = await res.json();
        renderPosts(posts);

      } catch (err) {
        console.error('Failed to load posts:', err);
        postsList.innerHTML = '<p class="empty">Failed to load posts</p>';
      }
    }

    // Render posts table
    function renderPosts(posts) {
      if (posts.length === 0) {
        postsList.innerHTML = `
          <p class="empty">No published posts yet. <a href="/admin/editor">Create your first post</a></p>
        `;
        return;
      }

      // Sort by published date descending
      posts.sort((a, b) => new Date(b.publishedAt) - new Date(a.publishedAt));

      postsList.innerHTML = `
        <div class="table-header">
          <div>Title</div>
          <div>Slug</div>
          <div>Published</div>
          <div>Actions</div>
        </div>
        ${posts.map(post => `
          <div class="table-row" data-id="${post.id}">
            <div class="post-title">
              <a href="/blog/${post.slug}" target="_blank">${escapeHtml(post.title)}</a>
            </div>
            <div class="post-slug">/blog/${escapeHtml(post.slug)}</div>
            <div class="post-date">${formatDate(post.publishedAt)}</div>
            <div class="post-actions">
              <a href="/admin/editor?post=${post.id}" class="btn-action">Edit</a>
              <button class="btn-action" data-action="unpublish" data-id="${post.id}">Unpublish</button>
              <button class="btn-action danger" data-action="delete" data-id="${post.id}">Delete</button>
            </div>
          </div>
        `).join('')}
      `;

      // Add event listeners for action buttons
      postsList.querySelectorAll('[data-action]').forEach(btn => {
        btn.addEventListener('click', () => handleAction(btn.dataset.action, btn.dataset.id));
      });
    }

    // Handle action buttons
    function handleAction(action, id) {
      const post = document.querySelector(`[data-id="${id}"]`);
      const title = post?.querySelector('.post-title a')?.textContent || 'this post';

      if (action === 'unpublish') {
        showConfirmDialog(
          'Unpublish Post',
          `Are you sure you want to unpublish "${title}"? It will be moved to drafts.`,
          () => unpublishPost(id)
        );
      } else if (action === 'delete') {
        showConfirmDialog(
          'Delete Post',
          `Are you sure you want to permanently delete "${title}"? This cannot be undone.`,
          () => deletePost(id)
        );
      }
    }

    // Show confirm dialog
    function showConfirmDialog(title, message, onConfirm) {
      dialogTitle.textContent = title;
      dialogMessage.textContent = message;
      pendingAction = onConfirm;
      confirmDialog.hidden = false;
    }

    // Hide confirm dialog
    function hideConfirmDialog() {
      confirmDialog.hidden = true;
      pendingAction = null;
    }

    // Dialog event listeners
    dialogCancel.addEventListener('click', hideConfirmDialog);
    dialogConfirm.addEventListener('click', async () => {
      if (pendingAction) {
        await pendingAction();
      }
      hideConfirmDialog();
    });

    // Click outside to close
    confirmDialog.addEventListener('click', (e) => {
      if (e.target === confirmDialog) {
        hideConfirmDialog();
      }
    });

    // Unpublish post
    async function unpublishPost(id) {
      try {
        const res = await fetch(`/api/admin/posts/${id}/unpublish`, {
          method: 'POST',
        });

        if (res.ok) {
          loadPosts();
        } else {
          const err = await res.json();
          alert(err.error || 'Failed to unpublish');
        }
      } catch (err) {
        alert('Failed to unpublish post');
      }
    }

    // Delete post
    async function deletePost(id) {
      try {
        const res = await fetch(`/api/admin/posts/${id}`, {
          method: 'DELETE',
        });

        if (res.ok) {
          loadPosts();
        } else {
          const err = await res.json();
          alert(err.error || 'Failed to delete');
        }
      } catch (err) {
        alert('Failed to delete post');
      }
    }

    // Utility functions
    function formatDate(iso) {
      return new Date(iso).toLocaleDateString('en-US', {
        month: 'short',
        day: 'numeric',
        year: 'numeric'
      });
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Logout handler
    document.getElementById('logout-btn').addEventListener('click', async () => {
      await fetch('/api/auth/logout', { method: 'POST' });
      window.location.href = '/admin/login';
    });

    // Initialize
    loadPosts();
  </script>
</body>
</html>
