<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Posts | Admin | Garrett Peake</title>
  <link rel="stylesheet" href="/styles/theme.css">
  <link rel="stylesheet" href="/styles/base.css">
  <link rel="stylesheet" href="/styles/components.css">
  <link rel="stylesheet" href="/styles/admin.css">
  <link rel="stylesheet" href="/styles/pages/admin-posts.css">
  <script type="module" src="/components/core/gp-theme-toggle.js"></script>
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="/" class="logo">GP</a>
        <span class="admin-badge">Admin</span>
      </div>

      <nav class="sidebar-nav">
        <a href="/admin/" class="nav-item">Dashboard</a>
        <a href="/admin/posts" class="nav-item active">Posts</a>
        <a href="/admin/drafts" class="nav-item">Drafts</a>
        <a href="/admin/photos" class="nav-item">Photos</a>
        <a href="/admin/projects" class="nav-item">Projects</a>
        <a href="/admin/tracking" class="nav-item">Tracking</a>
      </nav>

      <div class="sidebar-footer">
        <gp-theme-toggle></gp-theme-toggle>
        <button id="logout-btn" class="btn-logout">Logout</button>
      </div>
    </aside>

    <main class="admin-main">
      <header class="admin-header">
        <h1>Published Posts</h1>
        <a href="/admin/editor" class="btn-primary">+ New Post</a>
      </header>

      <div id="posts-list">
        <p class="loading">Loading posts...</p>
      </div>
    </main>
  </div>

  <!-- Confirm Dialog -->
  <div id="confirm-dialog" class="dialog-overlay" hidden>
    <div class="dialog">
      <h3 id="dialog-title">Confirm Action</h3>
      <p id="dialog-message">Are you sure?</p>
      <div class="dialog-actions">
        <button id="dialog-cancel" class="btn-secondary">Cancel</button>
        <button id="dialog-confirm" class="btn-danger">Confirm</button>
      </div>
    </div>
  </div>

  <script src="/js/admin/posts.js"></script>
</body>
</html>
