<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Photos | Admin | Garrett Peake</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="stylesheet" href="/styles/theme.css">
  <link rel="stylesheet" href="/styles/base.css">
  <link rel="stylesheet" href="/styles/components.css">
  <link rel="stylesheet" href="/styles/admin.css">
  <link rel="stylesheet" href="/styles/pages/admin-photos.css">
  <script type="module" src="/components/core/gp-theme-toggle.js"></script>
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <a href="/" class="logo">GP</a>
        <span class="admin-badge">Admin</span>
      </div>

      <nav class="sidebar-nav">
        <a href="/admin/" class="nav-item">Dashboard</a>
        <a href="/admin/posts" class="nav-item">Posts</a>
        <a href="/admin/drafts" class="nav-item">Drafts</a>
        <a href="/admin/photos" class="nav-item active">Photos</a>
        <a href="/admin/projects" class="nav-item">Projects</a>
        <a href="/admin/about" class="nav-item">About</a>
        <a href="/admin/tracking" class="nav-item">Tracking</a>
      </nav>

      <div class="sidebar-footer">
        <gp-theme-toggle></gp-theme-toggle>
        <button id="logout-btn" class="btn-logout">Logout</button>
      </div>
    </aside>

    <main class="admin-main">
      <header class="admin-header">
        <h1>Photography</h1>
      </header>

      <div id="photos-grid" class="photos-grid">
        <p class="loading">Loading photos...</p>
      </div>
    </main>
  </div>

  <!-- Upload Dialog -->
  <div id="upload-dialog" class="dialog-overlay" hidden>
    <div class="dialog dialog--wide">
      <h3>Upload Photo</h3>
      <form id="upload-form" class="photo-form">
        <div class="form-group">
          <label for="photo-file">Photo</label>
          <div class="file-upload-area" id="file-upload-area">
            <input type="file" id="photo-file" name="file" accept="image/jpeg,image/png,image/webp" required>
            <div class="file-upload-placeholder" id="file-placeholder">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <circle cx="8.5" cy="8.5" r="1.5"/>
                <path d="M21 15l-5-5L5 21"/>
              </svg>
              <span>Click or drag to upload</span>
            </div>
            <img id="file-preview" class="file-preview" alt="Preview" hidden>
          </div>
          <p class="form-help">JPEG, PNG, or WebP. Max 10MB. EXIF data will be removed.</p>
        </div>
        <div class="form-group">
          <label for="photo-location">Location</label>
          <input type="text" id="photo-location" name="location" placeholder="e.g., Tokyo, Japan">
        </div>
        <div class="form-group">
          <label for="photo-description">Description</label>
          <textarea id="photo-description" name="description" rows="3" placeholder="Brief description of the photo"></textarea>
        </div>
        <div class="dialog-actions">
          <button type="button" id="upload-cancel" class="btn btn--secondary">Cancel</button>
          <button type="submit" class="btn btn--primary">Upload</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Edit Dialog -->
  <div id="edit-dialog" class="dialog-overlay" hidden>
    <div class="dialog dialog--wide">
      <h3>Edit Photo</h3>
      <form id="edit-form" class="photo-form">
        <input type="hidden" id="edit-photo-id">
        <div class="form-group">
          <label>Preview</label>
          <div class="edit-preview-container">
            <img id="edit-preview" class="edit-preview" alt="Photo preview">
          </div>
        </div>
        <div class="form-group">
          <label for="edit-location">Location</label>
          <input type="text" id="edit-location" name="location" placeholder="e.g., Tokyo, Japan">
        </div>
        <div class="form-group">
          <label for="edit-description">Description</label>
          <textarea id="edit-description" name="description" rows="3" placeholder="Brief description of the photo"></textarea>
        </div>
        <div class="dialog-actions">
          <button type="button" id="edit-cancel" class="btn btn--secondary">Cancel</button>
          <button type="submit" class="btn btn--primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Confirm Delete Dialog -->
  <div id="confirm-dialog" class="dialog-overlay" hidden>
    <div class="dialog">
      <h3>Delete Photo</h3>
      <p>Are you sure you want to delete this photo? This cannot be undone.</p>
      <div class="dialog-actions">
        <button id="dialog-cancel" class="btn btn--secondary">Cancel</button>
        <button id="dialog-confirm" class="btn btn--danger">Delete</button>
      </div>
    </div>
  </div>

  <script src="/js/admin/photos.js"></script>
</body>
</html>
