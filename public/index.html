    <!-- SPA Router (desktop only, resize-aware) -->
    <script type="module">
      import * as spaRouter from '/js/spa/router.js';

      const SPA_BREAKPOINT = 900;
      let wasDesktop = window.innerWidth >= SPA_BREAKPOINT;

      // Initialize SPA on desktop
      if (wasDesktop) {
        spaRouter.init();
      }

      // Handle resize across the breakpoint
      let resizeTimer;
      window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          const isDesktop = window.innerWidth >= SPA_BREAKPOINT;

          if (isDesktop === wasDesktop) return;

          if (isDesktop && !wasDesktop) {
            // Crossed from mobile to desktop: initialize SPA with current route
            spaRouter.init();
          } else if (!isDesktop && wasDesktop) {
            // Crossed from desktop to mobile: tear down SPA cleanly
            // The URL already reflects the current section via History API,
            // so the mobile layout will show the correct page if navigated.
            spaRouter.destroy();
          }

          wasDesktop = isDesktop;
        }, 150);
      });
    </script>
