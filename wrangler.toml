name = "gpeake-site"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[observability]
[observability.logs]
enabled = true
invocation_logs = true

# Static assets configuration
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "none"
# Invoke Worker for all routes so we can handle 404s properly
run_worker_first = true

# KV Namespace binding
[[kv_namespaces]]
binding = "KV"
id = "255ea6f6b3514decb5483765d99cf66a"
preview_id = "255ea6f6b3514decb5483765d99cf66a"

# R2 Bucket binding
[[r2_buckets]]
binding = "R2"
bucket_name = "gpeake-files"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "personal-site"
database_id = "9ed05dc5-17fa-4422-a09e-e5fb2c75f86d"

# Analytics Engine binding
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "page_views"
